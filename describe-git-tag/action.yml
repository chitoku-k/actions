name: Describe git tag
description: Get a human-readable object name of the commit

inputs:
  semantic-versioning:
    description: Whether to output a version number compatible with Semantic Versioning
    default: "false"
outputs:
  value:
    description: Human-readable object name of the commit
    value: ${{ steps.describe.outputs.value }}
  major:
    description: Major version (Semantic Versioning)
    value: ${{ steps.describe.outputs.major }}
  minor:
    description: Minor version (Semantic Versioning)
    value: ${{ steps.describe.outputs.minor }}
  patch:
    description: Patch version (Semantic Versioning)
    value: ${{ steps.describe.outputs.patch }}
  pre-release:
    description: Pre-release version (Semantic Versioning)
    value: ${{ steps.describe.outputs.pre-release }}

runs:
  using: composite
  steps:
    - name: Describe git tag
      shell: bash
      id: describe
      env:
        SEMANTIC_VERSIONING: ${{ inputs.semantic-versioning }}
      run: |
        value=$(git describe --tags --always --dirty=+dirty)

        if [[ $SEMANTIC_VERSIONING = true ]]; then
          if [[ $value =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)(-([A-Za-z-]+(\.[A-Za-z0-9]+)*))?(-([0-9]+)-g([0-9a-f]+))?(\+dirty)?$ ]]; then
            major=${BASH_REMATCH[1]}
            minor=${BASH_REMATCH[2]}
            patch=${BASH_REMATCH[3]}
            pre_release=${BASH_REMATCH[5]}
            commitnum=${BASH_REMATCH[8]}
            commithash=${BASH_REMATCH[9]}
            dirty=${BASH_REMATCH[10]}

            if [[ $commitnum -gt 0 ]]; then
              patch=$(( patch + 1 ))
              pre_release=dev.$commitnum-g$commithash
            fi
          else
            major=0
            minor=0
            patch=0
            pre_release=dev.g$value
          fi

          value=$major.$minor.$patch
          if [[ -n $pre_release ]]; then
            value+=-$pre_release
          fi
          if [[ -n ${dirty:-} ]]; then
            value+=$dirty
          fi
        fi

        cat << EOF >> "$GITHUB_OUTPUT"
        value=${value:-}
        major=${major:-}
        minor=${minor:-}
        patch=${patch:-}
        pre-release=${pre_release:-}
        EOF
