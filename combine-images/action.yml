name: Combine images
description: Download artifacts of image digests

inputs:
  directory:
    description: Directory to load digests
    default: ${{ runner.temp }}/digests
  name:
    description: Image name
    required: true
  tags:
    description: Comma-delimited list of tags
    default: latest
  annotations:
    description: Newline-delimited list of annotations

runs:
  using: composite
  steps:
    - name: Create manifest list and push
      shell: bash
      working-directory: ${{ inputs.directory }}
      env:
        ANNOTATIONS: ${{ inputs.annotations }}
        TAGS: ${{ inputs.tags }}
      run: |
        opts=()

        if [[ -n $ANNOTATIONS ]]; then
          opts+=($(printf -- '--annotation=index:%s ' $(echo $ANNOTATIONS)))
        fi

        if [[ -n $TAGS ]]; then
          opts+=($(printf -- '--tag=${{ inputs.name }}:%s ' $(tr ',' ' ' <<< "$TAGS")))
        fi

        docker buildx imagetools create \
          "${opts[@]}" \
          $(printf -- '${{ inputs.name }}@sha256:%s ' *)
